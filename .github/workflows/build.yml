name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 创建 Release 需要写权限（仅 tag 构建时用到）
permissions:
  contents: write

# 同一分支/标签的重复构建自动取消，避免浪费 runner
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 缓存签名 keystore：保证每次 CI 构建用同一把钥匙签名，
      # 用户才能直接覆盖安装新版本（否则需先卸载）。
      # 首次运行由 build_apk.py 自动生成并写入缓存，之后一直复用。
      - name: Cache signing keystore
        uses: actions/cache@v4
        with:
          path: module/signing.keystore
          key: signing-keystore-v1

      # 打 tag（v1.2.3）时把版本号注入构建；普通 push/PR 用 build.sh 默认值 1.0/1
      - name: Set version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          # v1.2.3 -> 10203（versionCode 必须随版本递增）
          CODE=$(echo "$TAG" | sed -E 's/^v//' | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: sh module/build.sh
        env:
          HBR_VERSION_NAME: ${{ steps.version.outputs.name }}
          HBR_VERSION_CODE: ${{ steps.version.outputs.code }}

      - name: Verify APK contents
        run: |
          unzip -l module/HyperOS-Enhanced-Brightness.apk
          test "$(unzip -Z1 module/HyperOS-Enhanced-Brightness.apk | grep -cx 'classes.dex')" = 1
          test "$(unzip -Z1 module/HyperOS-Enhanced-Brightness.apk | grep -cx 'assets/xposed_init')" = 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS-Enhanced-Brightness-apk
          path: module/HyperOS-Enhanced-Brightness.apk
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: module/HyperOS-Enhanced-Brightness.apk
          generate_release_notes: true
